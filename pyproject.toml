[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "surveillance-analytics-platform"
version = "0.1.0"
description = "Public Health Surveillance & Analytics Platform — a modular research software platform for reproducible infectious disease surveillance analytics."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Mulaikah Kamran" }
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
