# Deep teal and warm amber, deliberately avoiding the AI-generated-
# design tells (cream+terracotta, near-black+neon, SaaS-purple
# gradients). Both light and dark are defined so the toggle in the
# settings menu actually has something to switch between -- a single
# [theme] block leaves nothing to toggle, which is why this was
# missing before it was properly checked.

[theme.light]
primaryColor = "#1B4B4F"
backgroundColor = "#FAFAF8"
secondaryBackgroundColor = "#F0EFEA"
textColor = "#1A1A1A"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"

[theme.light.sidebar]
backgroundColor = "#F0EFEA"

[theme.dark]
primaryColor = "#4FA8A2"
backgroundColor = "#14181C"
secondaryBackgroundColor = "#1E252B"
textColor = "#E8E6E1"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"

[theme.dark.sidebar]
backgroundColor = "#1A2024"
