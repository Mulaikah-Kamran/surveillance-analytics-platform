name: CI

# Lightweight CI, per the Freeze Document's CI Strategy (Section 27):
# every push and pull request installs dependencies, runs Ruff, runs
# Black in check mode, and runs pytest. No deployment step.

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Black
        run: black --check .

      - name: Run tests with pytest
        run: pytest
